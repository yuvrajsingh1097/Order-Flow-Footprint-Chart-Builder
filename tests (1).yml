name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run full pipeline (smoke test)
        run: python src/main.py

      - name: Run absorption detector (smoke test)
        run: python src/absorption_detector.py

      - name: Run backtest (smoke test)
        run: python src/backtest.py

      - name: Run parameter sweep (smoke test)
        run: python src/parameter_sweep.py
